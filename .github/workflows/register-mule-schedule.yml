name: Register MuleSoft API Schedule

run-name: "Register MuleSoft schedule - automatic"

on:
  push:
    branches: [main]
    paths:
      - "config/schedules.yml"

permissions:
  contents: write

jobs:
  register:
    name: "Register current IST schedule"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update scheduled workflow from HH:MM configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          cfg = Path("config/schedules.yml").read_text(encoding="utf-8")

          def read_time(section):
              m = re.search(
                  rf"(?ms)^\s*{re.escape(section)}:\s*\n"
                  rf"\s+enabled:\s*(true|false)\s*\n"
                  rf"\s+time:\s*['\"](\d{{2}}):(\d{{2}})['\"]\s*$",
                  cfg,
              )
              if not m:
                  raise SystemExit(f"Invalid {section} schedule in config/schedules.yml")
              enabled = m.group(1) == "true"
              hour = int(m.group(2))
              minute = int(m.group(3))
              if hour > 23 or minute > 59:
                  raise SystemExit(f"Invalid {section} time: {hour:02d}:{minute:02d}")
              return enabled, hour, minute

          stop_enabled, stop_h, stop_m = read_time("stop")
          start_enabled, start_h, start_m = read_time("start")

          schedules = []
          if stop_enabled:
              schedules.append(f'    - cron: "{stop_m} {stop_h} * * *"\n      timezone: "Asia/Kolkata"')
          if start_enabled:
              schedules.append(f'    - cron: "{start_m} {start_h} * * *"\n      timezone: "Asia/Kolkata"')

          if not schedules:
              raise SystemExit("At least one automatic schedule must be enabled.")

          workflow_path = Path(".github/workflows/mule-api-scheduler.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          marker = "on:\n  schedule:\n"
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit("Could not find on.schedule in mule-api-scheduler.yml")

          permissions = workflow.find("\npermissions:", start)
          if permissions < 0:
              raise SystemExit("Could not find permissions section in mule-api-scheduler.yml")

          new_schedule = (
              "on:\n"
              "  schedule:\n"
              "    # Generated automatically from config/schedules.yml.\n"
              "    # Users edit only normal 24-hour IST HH:MM values.\n"
              + "\n".join(schedules)
              + "\n"
          )

          workflow = workflow[:start] + new_schedule + workflow[permissions + 1:]
          workflow_path.write_text(workflow, encoding="utf-8")

          print(f"Registered stop: {'enabled' if stop_enabled else 'disabled'} {stop_h:02d}:{stop_m:02d} IST")
          print(f"Registered start: {'enabled' if start_enabled else 'disabled'} {start_h:02d}:{start_m:02d} IST")
          PY

      - name: Commit updated schedule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .github/workflows/mule-api-scheduler.yml; then
            echo "Schedule already matches config/schedules.yml."
            exit 0
          fi

          git add .github/workflows/mule-api-scheduler.yml
          git commit -m "chore: register MuleSoft schedule from config"
          git push origin HEAD:main
          echo "::notice::MuleSoft automatic schedule registered successfully."
