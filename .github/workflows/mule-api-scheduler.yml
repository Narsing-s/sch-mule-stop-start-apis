name: MuleSoft API Auto Start Stop

run-name: "MuleSoft API Scheduler - ${{ inputs.action || 'schedule' }}"

on:
  push:
    branches:
      - main
    paths:
      - "config/schedules.yml"
      - "config/all/**"
      - "scripts/mule_control.py"
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: "schedule"
        type: choice
        options:
          - schedule
          - start
          - stop
      region:
        description: "CloudHub region"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - west
          - westb
          - east
      business_group:
        description: "Anypoint Business Group name or ID"
        required: true
        default: ""
        type: string
      api:
        description: "Optional single API/application name or ID"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  run-scheduled-action:
    name: "wait for configured IST action / per-API environments"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: sandbox
    concurrency:
      group: mule-api-scheduler-${{ inputs.action || 'schedule' }}-${{ inputs.business_group }}-${{ inputs.region || 'all' }}
      cancel-in-progress: true
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_HOST: ${{ vars.ANYPOINT_HOST || 'anypoint.mulesoft.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve next configured IST action and wait
        id: schedule
        shell: bash
        run: |
          set -euo pipefail
          requested_action="${{ inputs.action }}"
          if [ "$requested_action" = "start" ] || [ "$requested_action" = "stop" ]; then
            echo "action=$requested_action" >> "$GITHUB_OUTPUT"
            echo "configured_time=NOW" >> "$GITHUB_OUTPUT"
            echo "business_group=${{ inputs.business_group }}" >> "$GITHUB_OUTPUT"
            echo "Manual action requested: $requested_action"
          else
            python3 scripts/schedule_wait.py
          fi

      - name: Validate credentials and configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name in GitHub Environment 'sandbox'."; exit 1; fi
          done
          test -f config/all/apis.txt || { echo "::error::Missing config/all/apis.txt"; exit 1; }

      - name: Install Anypoint CLI v4
        shell: bash
        run: |
          set -euo pipefail
          npm install --global anypoint-cli-v4-public
          anypoint-cli-v4 --version

      - name: Validate scheduler controller before touching Mule applications
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mule_control.py scripts/schedule_wait.py scripts/send_scheduler_email.py
          echo "::notice::Scheduler Python controllers passed syntax validation."

      - name: Verify Connected App authentication
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST "https://${ANYPOINT_HOST}/accounts/api/v2/oauth2/token" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")"
          if [ "$status" != "200" ]; then
            echo "::error::Connected App authentication failed: HTTP $status"
            exit 1
          fi
          token="$(jq -r '.access_token // empty' "$response_file")"
          if [ -z "$token" ]; then
            echo "::error::Connected App authentication returned HTTP 200 but no access_token."
            exit 1
          fi
          echo "::notice::Connected App authentication successful (HTTP 200)."
          echo "::group::Verify Anypoint CLI can authenticate"
          anypoint-cli-v4 account:environment:list --organization "$ANYPOINT_ORG" --client_id "$ANYPOINT_CLIENT_ID" --client_secret "$ANYPOINT_CLIENT_SECRET" --output json >/tmp/anypoint-environments.json
          echo "::notice::Anypoint CLI authentication and organization access verified."
          echo "::endgroup::"

      - name: Set selected Business Group
        shell: bash
        run: |
          set -euo pipefail
          bg="${{ steps.schedule.outputs.business_group || inputs.business_group }}"
          if [[ -z "$bg" ]]; then
            echo "::error::Business Group is required."
            exit 1
          fi
          # ANYPOINT_ORG remains the Connected App Anypoint organization ID.
          # ANYPOINT_BG is the logical Business Group label used by the scheduler.
          echo "ANYPOINT_BG=$bg" >> "$GITHUB_ENV"
          echo "::notice::Selected Anypoint Business Group: $bg"
          echo "::notice::Anypoint organization ID remains sourced from GitHub Environment secret ANYPOINT_ORG_ID."

      - name: Start configured applications
        if: ${{ steps.schedule.outputs.action == 'start' }}
        env:
          MULE_ACTION: start
          MULE_REGION: ${{ inputs.region || 'all' }}
          MULE_API_FILTER: ${{ inputs.api || '' }}
          MULE_ANALYTICS_FILE: mule-execution-analytics.json
        run: |
          set -euo pipefail
          echo "Executing START action for master inventory, region=${MULE_REGION}"
          python3 scripts/mule_control.py

      - name: Stop configured applications
        if: ${{ steps.schedule.outputs.action == 'stop' }}
        env:
          MULE_ACTION: stop
          MULE_REGION: ${{ inputs.region || 'all' }}
          MULE_ANALYTICS_FILE: mule-execution-analytics.json
        run: |
          set -euo pipefail
          echo "Executing STOP action for master inventory, region=${MULE_REGION}"
          python3 scripts/mule_control.py

      - name: Verify execution analytics
        if: ${{ always() && (steps.schedule.outputs.action == 'start' || steps.schedule.outputs.action == 'stop') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s mule-execution-analytics.json ]]; then
            echo "::error::Controller did not produce mule-execution-analytics.json. The START/STOP operation cannot be considered successful."
            echo "Workspace: $PWD"
            ls -la
            exit 1
          fi
          echo "::notice::Execution analytics file created:"
          jq '{action,business_group,total,successful,failed,error}' mule-execution-analytics.json
      - name: Email execution analytics
        if: ${{ always() && (steps.schedule.outputs.action == 'start' || steps.schedule.outputs.action == 'stop') }}
        continue-on-error: true
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MULE_ANALYTICS_FILE: mule-execution-analytics.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/send_scheduler_email.py
      - name: Reject invalid scheduled action
        if: ${{ steps.schedule.outputs.action != 'start' && steps.schedule.outputs.action != 'stop' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Scheduler resolved an invalid action: '${{ steps.schedule.outputs.action }}'. Expected start or stop."
          exit 1

      - name: Queue next daily scheduler cycle
        if: ${{ steps.schedule.outputs.handoff != 'true' && (github.event_name == 'push' || inputs.action == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Completed scheduled action; queueing the next daily cycle with workflow_dispatch."
          gh workflow run mule-api-scheduler.yml --repo "${{ github.repository }}" --ref main -f action=schedule -f region=all -f business_group="${{ steps.schedule.outputs.business_group || inputs.business_group }}"
          echo "::notice::Next daily scheduler cycle queued."
      - name: Publish execution summary
        if: always()
        env:
          MULE_ACTION: ${{ steps.schedule.outputs.action }}
          CONFIGURED_TIME: ${{ steps.schedule.outputs.configured_time }}
        run: |
          {
            echo "## MuleSoft API Scheduler"
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| GitHub Environment | **sandbox** (credentials only) |"
            echo "| Business Group | **${{ steps.schedule.outputs.business_group || inputs.business_group }}** |"
            echo "| Action | **${MULE_ACTION^^}** |"
            echo "| Configured time | **${CONFIGURED_TIME} IST** |"
            echo "| Region filter | **${{ inputs.region || 'all' }}** |"
            echo "| Scheduling model | **Immediate trigger + wait; no cron** |"
          } >> "$GITHUB_STEP_SUMMARY"


  cleanup-failed-runs:
    name: "Remove old failed scheduler runs"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove completed failed runs from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="${{ github.run_id }}"
          gh run list --repo "${{ github.repository }}" --workflow mule-api-scheduler.yml --status failure --limit 100 --json databaseId --jq '.[].databaseId' |
          while IFS= read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$current" ]] && continue
            gh api --method DELETE "repos/${{ github.repository }}/actions/runs/$run_id"
          done
