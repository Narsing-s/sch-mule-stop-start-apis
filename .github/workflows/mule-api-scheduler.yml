name: MuleSoft API Auto Start Stop

run-name: "MuleSoft API Scheduler - ${{ inputs.action || 'schedule' }}"

on:
  push:
    branches:
      - main
    paths:
      - "config/schedules.yml"
      - "config/eapi/**"
      - "config/papi/**"
      - "config/sapi/**"
      - "config/other/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: "schedule"
        type: choice
        options:
          - schedule
          - start
          - stop
      group:
        description: "API group"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - eapi
          - papi
          - sapi
          - other
      region:
        description: "CloudHub region"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - west
          - westb
          - east
      business_group:
        description: "Anypoint Business Group name or ID"
        required: true
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  run-scheduled-action:
    name: "sandbox / wait for configured IST action"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: sandbox
    concurrency:
      group: mule-api-scheduler-${{ inputs.action || 'schedule' }}-${{ inputs.business_group }}-${{ inputs.group || 'all' }}-${{ inputs.region || 'all' }}
      cancel-in-progress: true
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_HOST: ${{ vars.ANYPOINT_HOST || 'anypoint.mulesoft.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve next configured IST action and wait
        id: schedule
        shell: bash
        run: |
          set -euo pipefail
          requested_action="${{ inputs.action }}"
          if [ "$requested_action" = "start" ] || [ "$requested_action" = "stop" ]; then
            echo "action=$requested_action" >> "$GITHUB_OUTPUT"
            echo "configured_time=NOW" >> "$GITHUB_OUTPUT"
            echo "business_group=${{ inputs.business_group }}" >> "$GITHUB_OUTPUT"
            echo "Manual action requested: $requested_action"
          else
            python3 scripts/schedule_wait.py
          fi

      - name: Validate credentials and configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name in GitHub Environment 'sandbox'."; exit 1; fi
          done
          for file in config/eapi/all/apis.txt config/eapi/west/apis.txt config/eapi/westb/apis.txt config/eapi/east/apis.txt config/papi/all/apis.txt config/papi/west/apis.txt config/papi/westb/apis.txt config/papi/east/apis.txt config/sapi/all/apis.txt config/sapi/west/apis.txt config/sapi/westb/apis.txt config/sapi/east/apis.txt config/other/all/apis.txt config/other/west/apis.txt config/other/westb/apis.txt config/other/east/apis.txt; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done

      - name: Install Anypoint CLI v4
        shell: bash
        run: |
          set -euo pipefail
          npm install --global anypoint-cli-v4-public
          anypoint-cli-v4 --version

      - name: Verify Connected App authentication
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST "https://${ANYPOINT_HOST}/accounts/api/v2/oauth2/token" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")"
          if [ "$status" != "200" ]; then
            echo "::error::Connected App authentication failed: HTTP $status"
            exit 1
          fi
          token="$(jq -r '.access_token // empty' "$response_file")"
          if [ -z "$token" ]; then
            echo "::error::Connected App authentication returned HTTP 200 but no access_token."
            exit 1
          fi
          echo "::notice::Connected App authentication successful (HTTP 200)."

      - name: Set selected Business Group
        shell: bash
        run: |
          set -euo pipefail
          bg="${{ steps.schedule.outputs.business_group || inputs.business_group }}"
          echo "ANYPOINT_BG=$bg" >> "$GITHUB_ENV"
          echo "ANYPOINT_ORG=$bg" >> "$GITHUB_ENV"
          echo "::notice::Selected Anypoint Business Group: $bg"

      - name: Automatically select Sandbox Anypoint environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          p=subprocess.run(["anypoint-cli-v4","account:environment:list","--output","json"],text=True,capture_output=True,check=False)
          print(p.stdout)
          if p.returncode: print(p.stderr); raise SystemExit(p.returncode)
          data=json.loads(p.stdout); envs=[]
          def walk(v):
              if isinstance(v,dict):
                  if "name" in v or "environmentName" in v: envs.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          def name(e): return str(e.get("name") or e.get("environmentName") or "").strip()
          def typ(e): return str(e.get("type") or e.get("environmentType") or "").strip()
          matches=[e for e in envs if name(e).lower()=="sandbox" or typ(e).lower()=="sandbox"]
          unique=[]; seen=set()
          for e in matches:
              k=(name(e).lower(),str(e.get("id") or e.get("environmentId") or ""))
              if k not in seen: seen.add(k); unique.append(e)
          exact=[e for e in unique if name(e).lower()=="sandbox"]
          if len(exact)==1: selected=exact[0]
          elif len(unique)==1: selected=unique[0]
          elif not unique: raise SystemExit("No accessible Anypoint Sandbox environment was found.")
          else: raise SystemExit("Multiple accessible Sandbox environments found; refusing to guess.")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("ANYPOINT_ENV="+name(selected)+"\n")
              out.write("ANYPOINT_ENV_ID="+str(selected.get("id") or selected.get("environmentId") or "")+"\n")
          print(f"::notice::Selected Sandbox Anypoint environment: {name(selected)}")
          PY

      - name: Start configured applications
        if: ${{ steps.schedule.outputs.handoff != 'true' && steps.schedule.outputs.action == 'start' }}
        env:
          MULE_ACTION: start
          MULE_GROUP: ${{ inputs.group || 'all' }}
          MULE_REGION: ${{ inputs.region || 'all' }}
        run: |
          set -euo pipefail
          echo "Executing START action for group=${MULE_GROUP}, region=${MULE_REGION}"
          python3 scripts/mule_control.py

      - name: Stop configured applications
        if: ${{ steps.schedule.outputs.handoff != 'true' && steps.schedule.outputs.action == 'stop' }}
        env:
          MULE_ACTION: stop
          MULE_GROUP: ${{ inputs.group || 'all' }}
          MULE_REGION: ${{ inputs.region || 'all' }}
        run: |
          set -euo pipefail
          echo "Executing STOP action for group=${MULE_GROUP}, region=${MULE_REGION}"
          python3 scripts/mule_control.py

      - name: Email execution analytics
        if: ${{ always() && steps.schedule.outputs.handoff != 'true' && (steps.schedule.outputs.action == 'start' || steps.schedule.outputs.action == 'stop') }}
        continue-on-error: true
        env:
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MULE_ANALYTICS_FILE: mule-execution-analytics.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/send_scheduler_email.py
      - name: Reject invalid scheduled action
        if: ${{ steps.schedule.outputs.handoff != 'true' && steps.schedule.outputs.action != 'start' && steps.schedule.outputs.action != 'stop' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Scheduler resolved an invalid action: '${{ steps.schedule.outputs.action }}'. Expected start or stop."
          exit 1

      - name: Queue next daily scheduler cycle
        if: ${{ steps.schedule.outputs.handoff != 'true' && (github.event_name == 'push' || inputs.action == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Completed scheduled action; queueing the next daily cycle with workflow_dispatch."
          gh workflow run mule-api-scheduler.yml --repo "${{ github.repository }}" --ref main             -f action=schedule -f group=all -f region=all -f business_group="${{ steps.schedule.outputs.business_group || inputs.business_group }}"
          echo "::notice::Next daily scheduler cycle queued."

      - name: Publish execution summary
        if: always()
        env:
          MULE_ACTION: ${{ steps.schedule.outputs.action }}
          CONFIGURED_TIME: ${{ steps.schedule.outputs.configured_time }}
        run: |
          {
            echo "## MuleSoft API Scheduler"
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | **sandbox** |"
            echo "| Business Group | **${{ steps.schedule.outputs.business_group || inputs.business_group }}** |"
            echo "| Anypoint environment | **${ANYPOINT_ENV:-unknown}** |"
            echo "| Action | **${MULE_ACTION^^}** |"
            echo "| Configured time | **${CONFIGURED_TIME} IST** |"
            echo "| Group | **${MULE_GROUP:-all}** |"
            echo "| Region | **${MULE_REGION:-all}** |"
            echo "| Scheduling model | **Immediate trigger + wait; no cron** |"
          } >> "$GITHUB_STEP_SUMMARY"


  cleanup-failed-runs:
    name: "Remove old failed scheduler runs"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove completed failed runs from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="${{ github.run_id }}"
          gh run list --repo "${{ github.repository }}" --workflow mule-api-scheduler.yml --status failure --limit 100 --json databaseId --jq '.[].databaseId' |
          while IFS= read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$current" ]] && continue
            gh api --method DELETE "repos/${{ github.repository }}/actions/runs/$run_id"
          done
