name: MuleSoft API Auto Start Stop

run-name: "MuleSoft API Scheduler - ${{ github.event_name == 'schedule' && 'automatic' || github.event_name == 'push' && 'workflow-install-check' || inputs.action }}"

on:
  # Runs once when this workflow is committed/updated, proving GitHub Actions
  # has discovered the workflow on the default branch. It never changes the
  # business schedule; the normal IST times remain in config/schedules.yml.
  push:
    branches: [main]
    paths:
      - ".github/workflows/mule-api-scheduler.yml"
  schedule:
    # Generic wake-up only. Business times are defined in config/schedules.yml (IST).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "MuleSoft application lifecycle action"
        required: true
        type: choice
        options: [stop, start]
      environment:
        description: "Anypoint/GitHub Environment"
        required: true
        type: choice
        options: [sandbox]
      business_group:
        description: "Business group"
        required: true
        type: string
        default: all
      group:
        description: "API group"
        required: true
        type: choice
        default: all
        options: [all, eapi, papi, sapi, other]
      region:
        description: "API region"
        required: true
        type: choice
        default: all
        options: [all, west, westb, east]

permissions:
  contents: read

jobs:
  control:
    concurrency:
      group: mule-api-scheduler-${{ matrix.environment }}
      cancel-in-progress: false
    name: "${{ matrix.environment }} / ${{ github.event_name == 'workflow_dispatch' && inputs.group || 'all' }} / ${{ github.event_name == 'workflow_dispatch' && inputs.action || github.event_name == 'push' && 'workflow-install-check' || 'automatic' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [sandbox]
        group: [all]
    environment: ${{ matrix.environment }}
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_ENV: ${{ vars.ANYPOINT_ENVIRONMENT }}
      ANYPOINT_HOST: ${{ vars.ANYPOINT_HOST || 'anypoint.mulesoft.com' }}
      MULE_GROUP: ${{ github.event_name == 'workflow_dispatch' && inputs.group || 'all' }}
      MULE_BUSINESS_GROUP: ${{ github.event_name == 'workflow_dispatch' && inputs.business_group || 'all' }}
      MULE_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'all' }}
      SELECTED_ENVIRONMENT: sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lifecycle action from normal IST time
        id: action
        shell: bash
        env:
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            action="$MANUAL_ACTION"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Workflow discovery check: no MuleSoft lifecycle action will be executed."
            echo "MULE_ACTION=none" >> "$GITHUB_ENV"
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Checking config/schedules.yml against current IST time..."
            date -u
            TZ=Asia/Kolkata date
            cat config/schedules.yml
            python3 scripts/schedule_check.py config/schedules.yml
            action="$(cat /tmp/mule-scheduler-action)"
            if [[ "$action" == "none" ]]; then
              echo "No configured lifecycle action is due at this IST minute. Skipping."
              echo "action=none" >> "$GITHUB_OUTPUT"
              echo "MULE_ACTION=none" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "MULE_ACTION=$action" >> "$GITHUB_ENV"

      - name: Validate credentials and configuration
        if: env.MULE_ACTION != 'none'
        shell: bash
        run: |
          set -euo pipefail
          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG ANYPOINT_ENV; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name in GitHub Environment '${{ matrix.environment }}'."
              exit 1
            fi
          done
          for file in config/eapi/all/apis.txt config/eapi/west/apis.txt config/eapi/westb/apis.txt config/eapi/east/apis.txt config/papi/all/apis.txt config/papi/west/apis.txt config/papi/westb/apis.txt config/papi/east/apis.txt config/sapi/all/apis.txt config/sapi/west/apis.txt config/sapi/westb/apis.txt config/sapi/east/apis.txt config/other/all/apis.txt config/other/west/apis.txt config/other/westb/apis.txt config/other/east/apis.txt; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done

      - name: Install Anypoint CLI v4
        if: env.MULE_ACTION != 'none'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global anypoint-cli-v4-public
          anypoint-cli-v4 --version

      - name: Verify Connected App authentication
        if: env.MULE_ACTION != 'none'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST "https://${ANYPOINT_HOST}/accounts/api/v2/oauth2/token" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")"
          status="$(printf '%s\n' "$response" | tail -n1)"
          body="$(printf '%s\n' "$response" | sed '$d')"
          if [[ "$status" != "200" ]]; then
            message="$(printf '%s' "$body" | jq -r '.error_description // .message // .error // empty' 2>/dev/null || true)"
            echo "::error::${{ matrix.environment }} Connected App authentication failed: HTTP $status $message"
            exit 1
          fi
          token="$(printf '%s' "$body" | jq -r '.access_token // empty')"
          [[ -n "$token" ]] || { echo "::error::No access_token returned."; exit 1; }
          echo "::notice::${{ matrix.environment }} Connected App authentication successful."

      - name: Resolve exact Anypoint environment
        if: env.MULE_ACTION != 'none'
        shell: bash
        run: |
          set -euo pipefail
          env -u ANYPOINT_ENV anypoint-cli-v4 account:environment:list --output json > /tmp/environments.json
          python3 - "$GITHUB_ENV" "${{ matrix.environment }}" /tmp/environments.json <<'PY'
          import json, sys
          target = sys.argv[2].strip().lower()
          with open(sys.argv[3], encoding='utf-8') as f:
              data = json.load(f)
          names, seen = [], set()
          def walk(v):
              if isinstance(v, dict):
                  yield v
                  for x in v.values(): yield from walk(x)
              elif isinstance(v, list):
                  for x in v: yield from walk(x)
          for obj in walk(data):
              for key in ('name', 'environmentName'):
                  value = obj.get(key)
                  if value:
                      name = str(value).strip()
                      if name and name.lower() not in seen:
                          seen.add(name.lower())
                          names.append(name)
          matches = [n for n in names if n.lower() == target]
          if not matches:
              print(f"::error::Anypoint environment '{sys.argv[2]}' is not visible to this Connected App.")
              print('Visible environments:')
              for n in names:
                  print('  - ' + n)
              raise SystemExit(2)
          with open(sys.argv[1], 'a', encoding='utf-8') as f:
              f.write('ANYPOINT_ENV=' + matches[0] + '\n')
          print('Using exact Anypoint environment:', matches[0])
          PY

      - name: Start or stop configured applications
        if: env.MULE_ACTION != 'none'
        shell: bash
        run: python3 scripts/mule_control.py

      - name: Publish execution summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MuleSoft API Scheduler"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | **${{ matrix.environment }}** |"
            echo "| Anypoint environment | **${ANYPOINT_ENV}** |"
            echo "| Business group | **${MULE_BUSINESS_GROUP^^}** |"
            echo "| API group | **${MULE_GROUP^^}** |"
            echo "| Region | **${MULE_REGION^^}** |"
            echo "| Action | **${MULE_ACTION^^}** |"
            echo "| Schedule source | **config/schedules.yml (24-hour IST)** |"
            echo "| Automatic trigger | **Every 5 minutes; configured IST time decides action** |"
          } >> "$GITHUB_STEP_SUMMARY"
