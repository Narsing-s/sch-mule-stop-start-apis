name: MuleSoft API Auto Start Stop

run-name: "MuleSoft API Scheduler - queued automatic"

on:
  push:
    branches:
      - main
    paths:
      - "config/schedules.yml"
      - "config/eapi/**"
      - "config/papi/**"
      - "config/sapi/**"
      - "config/other/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wait-for-configured-time:
    name: "sandbox / wait for configured IST time"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: sandbox
    concurrency:
      group: mule-api-scheduler-wait-sandbox
      cancel-in-progress: true
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_HOST: ${{ vars.ANYPOINT_HOST || 'anypoint.mulesoft.com' }}
    outputs:
      action: ${{ steps.schedule.outputs.action }}
      configured_time: ${{ steps.schedule.outputs.configured_time }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve configured IST time and wait
        id: schedule
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os
          import re
          import time

          text = Path("config/schedules.yml").read_text(encoding="utf-8")

          timezone_match = re.search(
              r'(?m)^\s*timezone:\s*["\']?([^\r\n"\']+)["\']?\s*$',
              text,
          )
          timezone = timezone_match.group(1).strip() if timezone_match else "Asia/Kolkata"

          if timezone != "Asia/Kolkata":
              raise SystemExit(
                  f"Only Asia/Kolkata is supported; found {timezone!r}"
              )

          def section(name):
              match = re.search(
                  rf"(?ms)^{re.escape(name)}:\s*\n(.*?)(?=^[A-Za-z0-9_-]+:\s*$|\Z)",
                  text,
              )
              return match.group(1) if match else ""

          def setting(name, key, default=None):
              body = section(name)
              match = re.search(
                  rf'(?m)^\s*{re.escape(key)}:\s*["\']?([^"\'\r\n]+)["\']?\s*$',
                  body,
              )
              return match.group(1).strip() if match else default

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          candidates = []

          for action in ("stop", "start"):
              enabled = setting(action, "enabled", "true").lower() in {"true", "yes", "1"}
              if not enabled:
                  continue

              value = setting(action, "time")
              if not value or not re.fullmatch(r"\d{2}:\d{2}", value):
                  raise SystemExit(f"Invalid {action}.time: {value!r}")

              hour, minute = map(int, value.split(":"))
              if hour > 23 or minute > 59:
                  raise SystemExit(f"Invalid {action}.time: {value!r}")

              target = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
              if target <= now:
                  target += timedelta(days=1)

              candidates.append((target, action, value))

          if not candidates:
              raise SystemExit("No enabled stop/start schedule is configured.")

          target, action, value = min(candidates)
          seconds = max(0, int((target - now).total_seconds()))

          print(f"Current IST time : {now:%Y-%m-%d %H:%M:%S}")
          print(f"Configured action : {action}")
          print(f"Configured time   : {value} IST")
          print(f"Next execution    : {target:%Y-%m-%d %H:%M:%S} IST")
          print(f"Wait seconds      : {seconds}")

          if seconds > 6 * 60 * 60:
              raise SystemExit(
                  f"Next configured time is {seconds / 3600:.2f} hours away. "
                  "The immediate-wait model supports times within six hours."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"action={action}\n")
              out.write(f"configured_time={value}\n")

          if seconds:
              print(f"Waiting {seconds} seconds for {action}...")
              time.sleep(seconds)

          print(f"Reached configured time: {value} IST")
          PY

      - name: Validate credentials and configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG ANYPOINT_ENV; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name in GitHub Environment 'sandbox'."
              exit 1
            fi
          done

          for file in \
            config/eapi/all/apis.txt config/eapi/west/apis.txt config/eapi/westb/apis.txt config/eapi/east/apis.txt \
            config/papi/all/apis.txt config/papi/west/apis.txt config/papi/westb/apis.txt config/papi/east/apis.txt \
            config/sapi/all/apis.txt config/sapi/west/apis.txt config/sapi/westb/apis.txt config/sapi/east/apis.txt \
            config/other/all/apis.txt config/other/west/apis.txt config/other/westb/apis.txt config/other/east/apis.txt; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done

      - name: Install Anypoint CLI v4
        shell: bash
        run: |
          set -euo pipefail
          npm install --global anypoint-cli-v4-public
          anypoint-cli-v4 --version

      - name: Verify Connected App authentication
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' \
            -X POST "https://${ANYPOINT_HOST}/accounts/api/v2/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" \
            --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")"

          status="$(printf '%s\n' "$response" | tail -n1)"
          body="$(printf '%s\n' "$response" | sed '$d')"

          if [[ "$status" != "200" ]]; then
            message="$(printf '%s' "$body" | jq -r '.error_description // .message // .error // empty' 2>/dev/null || true)"
            echo "::error::sandbox Connected App authentication failed: HTTP $status $message"
            exit 1
          fi

          token="$(printf '%s' "$body" | jq -r '.access_token // empty')"
          [[ -n "$token" ]] || { echo "::error::No access_token returned."; exit 1; }
          echo "::notice::sandbox Connected App authentication successful."

      - name: Automatically select Sandbox Anypoint environment
        id: resolve-environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          p = subprocess.run(
              ["anypoint-cli-v4", "account:environment:list", "--output", "json"],
              text=True, capture_output=True, check=False
          )
          print(p.stdout)
          if p.returncode != 0:
              print(p.stderr)
              raise SystemExit(p.returncode)

          data = json.loads(p.stdout)
          environments = []

          def walk(v):
              if isinstance(v, dict):
                  if any(k in v for k in ("name", "environmentName")):
                      environments.append(v)
                  for value in v.values():
                      walk(value)
              elif isinstance(v, list):
                  for value in v:
                      walk(value)

          walk(data)

          def name(e):
              return str(e.get("name") or e.get("environmentName") or "").strip()

          def typ(e):
              return str(e.get("type") or e.get("environmentType") or "").strip()

          sandbox = [e for e in environments if name(e).lower() == "sandbox" or typ(e).lower() == "sandbox"]

          unique = []
          seen = set()
          for e in sandbox:
              key = (name(e).lower(), str(e.get("id") or e.get("environmentId") or ""))
              if key not in seen:
                  seen.add(key)
                  unique.append(e)

          if not unique:
              print("::error::No accessible Anypoint Sandbox environment was found for this Connected App.")
              print("Accessible environments returned by Anypoint CLI:")
              for e in environments:
                  print(f"  - name={name(e)!r}, type={typ(e)!r}, id={e.get('id') or e.get('environmentId')!r}")
              raise SystemExit(2)

          exact = [e for e in unique if name(e).lower() == "sandbox"]
          if len(exact) == 1:
              selected = exact[0]
          elif len(unique) == 1:
              selected = unique[0]
          else:
              print("::error::Multiple accessible Sandbox environments were found; refusing to guess.")
              for e in unique:
                  print(f"  - name={name(e)!r}, type={typ(e)!r}, id={e.get('id') or e.get('environmentId')!r}")
              raise SystemExit(3)

          selected_name = name(selected)
          selected_id = str(selected.get("id") or selected.get("environmentId") or "").strip()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("ANYPOINT_ENV=" + selected_name + "\n")
              out.write("ANYPOINT_ENV_ID=" + selected_id + "\n")

          print(f"::notice::Automatically selected Anypoint Sandbox environment: {selected_name} (id={selected_id or 'n/a'})")
          PY

      - name: Start or stop configured applications
        shell: bash
        env:
          MULE_ACTION: ${{ steps.schedule.outputs.action }}
          MULE_GROUP: all
          MULE_REGION: all
        run: |
          set -euo pipefail
          echo "Executing configured action: ${MULE_ACTION}"
          python3 scripts/mule_control.py

      - name: Publish execution summary
        if: always()
        shell: bash
        env:
          MULE_ACTION: ${{ steps.schedule.outputs.action }}
          CONFIGURED_TIME: ${{ steps.schedule.outputs.configured_time }}
        run: |
          {
            echo "## MuleSoft API Scheduler"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | **sandbox** |"
            echo "| Anypoint environment | **${ANYPOINT_ENV:-unknown}** |"
            echo "| API group | **ALL** |"
            echo "| Region | **ALL** |"
            echo "| Action | **${MULE_ACTION^^}** |"
            echo "| Configured time | **${CONFIGURED_TIME} IST** |"
            echo "| Trigger | **Configuration/API-list push** |"
            echo "| Scheduling model | **Starts immediately, waits for config time, then executes — no cron** |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-failed-runs:
    name: "Remove old failed scheduler runs"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove completed failed runs from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="${{ github.run_id }}"
          gh run list --repo "${{ github.repository }}" --workflow mule-api-scheduler.yml --status failure --limit 100 --json databaseId --jq '.[].databaseId' |
          while IFS= read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$current" ]] && continue
            gh api --method DELETE "repos/${{ github.repository }}/actions/runs/$run_id"
          done
