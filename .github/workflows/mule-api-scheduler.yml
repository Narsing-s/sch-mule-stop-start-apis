name: MuleSoft API Auto Start Stop

run-name: "MuleSoft API Scheduler - queued automatic"

on:
  push:
    branches:
      - main
    paths:
      - "config/schedules.yml"
      - "config/eapi/**"
      - "config/papi/**"
      - "config/sapi/**"
      - "config/other/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-scheduled-action:
    name: "sandbox / wait for configured IST action"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: sandbox
    concurrency:
      group: mule-api-scheduler-wait-sandbox
      cancel-in-progress: true
    env:
      ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
      ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
      ANYPOINT_ORG: ${{ secrets.ANYPOINT_ORG_ID }}
      ANYPOINT_HOST: ${{ vars.ANYPOINT_HOST || 'anypoint.mulesoft.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve next configured IST action and wait
        id: schedule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os, re, time
          text=Path("config/schedules.yml").read_text(encoding="utf-8")
          tz=re.search(r'(?m)^\\s*timezone:\\s*["\\']?([^\\r\\n"\\']+)["\\']?\\s*$',text)
          if (tz.group(1).strip() if tz else "Asia/Kolkata") != "Asia/Kolkata":
              raise SystemExit("Only Asia/Kolkata is supported.")
          now=datetime.now(ZoneInfo("Asia/Kolkata"))
          candidates=[]
          for action in ("stop","start"):
              m=re.search(rf'(?ms)^{action}:\\s*\\n(.*?)(?=^[A-Za-z0-9_-]+:\\s*$|\\Z)',text)
              body=m.group(1) if m else ""
              en=re.search(r'(?m)^\\s*enabled:\\s*(true|false)',body)
              tm=re.search(r'(?m)^\\s*time:\\s*["\\']?(\\d{2}:\\d{2})["\\']?',body)
              if not en or en.group(1).lower()!="true": continue
              if not tm: raise SystemExit(f"Invalid {action}.time")
              h,mi=map(int,tm.group(1).split(":"))
              target=now.replace(hour=h,minute=mi,second=0,microsecond=0)
              if target<=now: target+=timedelta(days=1)
              candidates.append((target,action,tm.group(1)))
          if not candidates: raise SystemExit("No enabled stop/start schedule is configured.")
          target,action,value=min(candidates)
          seconds=int(max(0,(target-now).total_seconds()))
          print(f"Current IST time: {now:%Y-%m-%d %H:%M:%S}")
          print(f"Next action: {action} at {value} IST ({target:%Y-%m-%d %H:%M:%S})")
          if seconds>6*60*60:
              raise SystemExit(f"Next configured time is {seconds/3600:.2f} hours away. GitHub-hosted waiting is limited to six hours; choose a nearer time or trigger again.")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"action={action}\\nconfigured_time={value}\\n")
          if seconds:
              print(f"Waiting {seconds} seconds...")
              time.sleep(seconds)
          print("Configured time reached.")
          PY

      - name: Validate credentials and configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANYPOINT_CLIENT_ID ANYPOINT_CLIENT_SECRET ANYPOINT_ORG; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name in GitHub Environment 'sandbox'."; exit 1; fi
          done
          for file in config/eapi/all/apis.txt config/eapi/west/apis.txt config/eapi/westb/apis.txt config/eapi/east/apis.txt config/papi/all/apis.txt config/papi/west/apis.txt config/papi/westb/apis.txt config/papi/east/apis.txt config/sapi/all/apis.txt config/sapi/west/apis.txt config/sapi/westb/apis.txt config/sapi/east/apis.txt config/other/all/apis.txt config/other/west/apis.txt config/other/westb/apis.txt config/other/east/apis.txt; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done

      - name: Install Anypoint CLI v4
        shell: bash
        run: |
          set -euo pipefail
          npm install --global anypoint-cli-v4-public
          anypoint-cli-v4 --version

      - name: Verify Connected App authentication
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\\n%{http_code}' -X POST "https://${ANYPOINT_HOST}/accounts/api/v2/oauth2/token" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")"
          status="$(printf '%s\\n' "$response" | tail -n1)"
          body="$(printf '%s\\n' "$response" | sed '$d')"
          if [[ "$status" != "200" ]]; then echo "::error::Connected App authentication failed: HTTP $status"; exit 1; fi
          token="$(printf '%s' "$body" | jq -r '.access_token // empty')"
          [[ -n "$token" ]] || { echo "::error::No access_token returned."; exit 1; }
          echo "::notice::Connected App authentication successful."

      - name: Automatically select Sandbox Anypoint environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          p=subprocess.run(["anypoint-cli-v4","account:environment:list","--output","json"],text=True,capture_output=True,check=False)
          print(p.stdout)
          if p.returncode: print(p.stderr); raise SystemExit(p.returncode)
          data=json.loads(p.stdout); envs=[]
          def walk(v):
              if isinstance(v,dict):
                  if "name" in v or "environmentName" in v: envs.append(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(data)
          def name(e): return str(e.get("name") or e.get("environmentName") or "").strip()
          def typ(e): return str(e.get("type") or e.get("environmentType") or "").strip()
          matches=[e for e in envs if name(e).lower()=="sandbox" or typ(e).lower()=="sandbox"]
          unique=[]; seen=set()
          for e in matches:
              k=(name(e).lower(),str(e.get("id") or e.get("environmentId") or ""))
              if k not in seen: seen.add(k); unique.append(e)
          exact=[e for e in unique if name(e).lower()=="sandbox"]
          if len(exact)==1: selected=exact[0]
          elif len(unique)==1: selected=unique[0]
          elif not unique: raise SystemExit("No accessible Anypoint Sandbox environment was found.")
          else: raise SystemExit("Multiple accessible Sandbox environments found; refusing to guess.")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("ANYPOINT_ENV="+name(selected)+"\\n")
              out.write("ANYPOINT_ENV_ID="+str(selected.get("id") or selected.get("environmentId") or "")+"\\n")
          print(f"::notice::Selected Sandbox Anypoint environment: {name(selected)}")
          PY

      - name: Start or stop configured applications
        env:
          MULE_ACTION: ${{ steps.schedule.outputs.action }}
          MULE_GROUP: all
          MULE_REGION: all
        run: |
          set -euo pipefail
          echo "Executing configured action: ${MULE_ACTION}"
          python3 scripts/mule_control.py

      - name: Publish execution summary
        if: always()
        env:
          MULE_ACTION: ${{ steps.schedule.outputs.action }}
          CONFIGURED_TIME: ${{ steps.schedule.outputs.configured_time }}
        run: |
          {
            echo "## MuleSoft API Scheduler"
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | **sandbox** |"
            echo "| Anypoint environment | **${ANYPOINT_ENV:-unknown}** |"
            echo "| Action | **${MULE_ACTION^^}** |"
            echo "| Configured time | **${CONFIGURED_TIME} IST** |"
            echo "| Scheduling model | **Immediate trigger + wait; no cron** |"
          } >> "$GITHUB_STEP_SUMMARY"


  cleanup-failed-runs:
    name: "Remove old failed scheduler runs"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove completed failed runs from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="${{ github.run_id }}"
          gh run list --repo "${{ github.repository }}" --workflow mule-api-scheduler.yml --status failure --limit 100 --json databaseId --jq '.[].databaseId' |
          while IFS= read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$current" ]] && continue
            gh api --method DELETE "repos/${{ github.repository }}/actions/runs/$run_id"
          done
